# The whole end-to-end suite, on one VPS, behind Coolify's proxy.
#
#   1. Coolify -> + New -> Docker Compose -> point at this repo
#   2. set APP_PASSWORD (required), APP_SECRET (`openssl rand -hex 32`)
#   3. set a domain; Coolify terminates TLS (phones need HTTPS for the camera)
#
#   local:  APP_PASSWORD=secret docker compose up --build
#           -> http://localhost:8000/
#
# Three services, one volume story:
#
#   suite    the app (uvicorn, ONE worker)       - datasets, training, S2C
#   db       Postgres 16: projects, artefacts, job history, transfers
#   redis    job events (SSE fan-out) + expiring locks + heartbeats
#
# `db` and `redis` are not optional extras: without them the app falls back to
# SQLite ($DATA_DIR/suite.db) and an in-process bus, which works for a single
# worker but loses cross-process events and durable history on rebuild.

services:
  suite:
    build:
      context: .
      dockerfile: Dockerfile
    image: optical-modem-suite:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ---- required -------------------------------------------------------
      # Password for the whole suite (laptop + phone log in with it).
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      # Stable HMAC key for session cookies: `openssl rand -hex 32`.
      APP_SECRET: ${APP_SECRET:-}
      # ---- state ----------------------------------------------------------
      DATA_DIR: /data
      # Postgres: metadata only (a few MB); files stay on the volume.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-suite}:${POSTGRES_PASSWORD:-suite}@db:5432/${POSTGRES_DB:-suite}
      # Redis: job events, locks, heartbeats. Set SUITE_REDIS=0 to disable.
      REDIS_URL: redis://redis:6379/0
      # 1 = locate the frame in every capture upload (pure OpenCV, ~0.5-1.5 s)
      AUTOLABEL: ${AUTOLABEL:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-24}
      # auto = Secure exactly when the browser is on https (per request, read
      # from X-Forwarded-Proto). 1 forces Secure (breaks plain-http LAN tests),
      # 0 never sets it. auto is the only value that is right in both places.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Traefik (Coolify) terminates TLS and forwards plain http to this
      # container. TRUST_PROXY=1 lets net.py read X-Forwarded-Proto/Host.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Leave FORCE_HTTPS=0 while the proxy owns the redirect: two redirectors
      # is how redirect loops start. Set 1 only if this container is exposed
      # directly to the internet.
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      # The exact origin users type, e.g. https://s2c.example.com. Optional; it
      # is printed in the UI when the external origin cannot be inferred.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Training parallelism: keep it at the container's CPU limit, not the
      # host's, or torch will thrash. The compose limits below say 4.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      # Set 0 only if you have pre-populated /data/models with weights and do not
      # want ultralytics trying to reach the internet for a base checkpoint.
      YOLO_OFFLINE: ${YOLO_OFFLINE:-1}
      YOLO_CONFIG_DIR: /data/.ultralytics
      FORWARDED_ALLOW_IPS: "*"
      # Optional: when set, only this host serves /api/*, /healthz, /version.
      # Use with the API subdomain so the frontend domain stops exposing the API.
      API_HOST: ${API_HOST:-}
      # Explicit frontend origins for cross-origin API deployments.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # inprocess (default): this container runs jobs itself.
      # worker: this container only enqueues; the `worker` service runs them.
      #   Enable the worker with `docker compose --profile worker up -d` and set
      #   SUITE_RUN_JOBS=worker here too.
      #   If you enable the worker but forget this, nothing double-runs: the
      #   web process takes the claim and the worker sees the job as taken.
      #   You just get no benefit.
      SUITE_RUN_JOBS: ${SUITE_RUN_JOBS:-inprocess}
      # How many background jobs may run at once (per process). 1 is right for a
      # 4-core box: training already uses every core, and a second job only
      # thrashes. In worker mode this is the per-worker concurrency.
      SUITE_MAX_JOBS: ${SUITE_MAX_JOBS:-1}
      # Backlog cap when enqueueing for workers: refuse rather than grow a queue
      # nothing is draining.
      SUITE_MAX_QUEUED: ${SUITE_MAX_QUEUED:-50}
      # A job whose owner has not heartbeated in this long may be claimed by
      # another worker. Must comfortably exceed SUITE_HEARTBEAT.
      SUITE_CLAIM_TTL: ${SUITE_CLAIM_TTL:-300}
      SUITE_HEARTBEAT: ${SUITE_HEARTBEAT:-30}
      # Give up (rather than requeue forever) after this many attempts. Guards
      # against an input that reliably triggers the OOM killer.
      SUITE_MAX_ATTEMPTS: ${SUITE_MAX_ATTEMPTS:-3}
      # Networks allowed to set X-Forwarded-For. The login throttle trusts the
      # header ONLY from these; anywhere else the peer address is used, so a
      # spoofed header cannot rotate past the limit. Empty = trust nothing,
      # which is correct when the container is exposed directly.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # Refuses to boot without APP_PASSWORD. Set 1 ONLY for a deliberately
      # open instance on a trusted LAN.
      ALLOW_ANONYMOUS: ${ALLOW_ANONYMOUS:-0}
      # Force the S2C receiver mode: auto (default) | yolo | classical.
      S2C_DECODE_MODE: ${S2C_DECODE_MODE:-auto}
    volumes:
      # datasets, runs, models, jobs and photos all live here: one volume to
      # back up, one directory to copy to a bigger disk later
      - suite-data:/data
    ports:
      - "${SUITE_PORT:-8889}:8889"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8889/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        # Caps, not reservations. The web process serves requests and does the
        # interactive decode (S2C, autolabel ~1.4 s/photo), so it needs real CPU;
        # long training belongs in `worker` where an OOM cannot take the UI down.
        # On a 4-core box lower both this and the worker limit to fit.
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Long jobs (training, big syntheses) run here instead of inside `suite`, so a
  # heavy run cannot starve request serving and an OOM kill does not take the UI
  # down with it. Opt in with:  docker compose --profile worker up -d
  # Scale out with:            docker compose --profile worker up -d --scale worker=3
  # (each replica is its own worker id; the claim protocol keeps them from
  # running the same job twice)
  worker:
    profiles: ["worker"]
    stop_grace_period: 15m      # let a training run finish before SIGKILL
    build:
      context: .
      dockerfile: Dockerfile
    image: optical-modem-suite:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD}
      APP_SECRET: ${APP_SECRET:-}
      DATA_DIR: /data
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-suite}:${POSTGRES_PASSWORD:-suite}@db:5432/${POSTGRES_DB:-suite}
      REDIS_URL: redis://redis:6379/0
      SUITE_RUN_JOBS: worker
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      YOLO_OFFLINE: ${YOLO_OFFLINE:-1}
      YOLO_CONFIG_DIR: /data/.ultralytics
      SUITE_MAX_JOBS: ${SUITE_MAX_JOBS:-1}
      SUITE_PYTHON: ${SUITE_PYTHON:-}
      SUITE_CLAIM_TTL: ${SUITE_CLAIM_TTL:-300}
      SUITE_HEARTBEAT: ${SUITE_HEARTBEAT:-30}
      SUITE_MAX_ATTEMPTS: ${SUITE_MAX_ATTEMPTS:-3}
      # On SIGTERM, finish the current jobs rather than killing them mid-run --
      # a training run costs hours. After this, release them so another worker
      # picks them up instead of leaving them stuck.
      SUITE_WORKER_DRAIN_TIMEOUT: ${SUITE_WORKER_DRAIN_TIMEOUT:-900}
      # Poll faster while busy so the queue drains promptly, slower when idle
      # instead of hammering the database.
      SUITE_WORKER_IDLE_POLL: ${SUITE_WORKER_IDLE_POLL:-2.0}
      SUITE_WORKER_BUSY_POLL: ${SUITE_WORKER_BUSY_POLL:-0.5}
      PYTHONPATH: /app
    volumes:
      - suite-data:/data
    command: ["python", "-m", "optical_modem.suite.worker"]
    deploy:
      resources:
        # Training is the one thing in this stack that wants every core and a
        # lot of RAM. If runs OOM, raise memory and lower `batch` on the page.
        limits:
          cpus: "4.0"
          memory: 6g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suite}
      POSTGRES_DB: ${POSTGRES_DB:-suite}
      # the suite only needs metadata: keep Postgres small and predictable
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - suite-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suite} -d ${POSTGRES_DB:-suite}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # aof = job events survive a restart; 128 MB is plenty for a ring buffer
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb",
              "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - suite-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  suite-data:
    # Prefer real disk for datasets and photos?  Bind a host path instead:
    # driver_opts: { type: none, o: bind, device: /srv/optical-suite }
  suite-db:
  suite-redis:
