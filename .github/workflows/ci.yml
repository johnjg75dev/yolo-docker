name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-progress run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the target runtime (see Dockerfile); 3.11 is the floor, since
        # the SQLite claim protocol and the asyncio SSE path are the parts most
        # likely to behave differently across versions.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # No PYTHONPATH and no DATA_DIR: pyproject.toml sets pythonpath and the
        # suite must pass from a bare checkout. If it needs environment help,
        # that is a bug in the test config, not in the workflow.
        run: pytest --cov=optical_modem --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is committed, and CI
      # must not silently drift the dependency tree.
      - run: npm ci
      # `build` runs `tsc --noEmit` first, so this is the typecheck too.
      - run: npm run build

      - name: Fail if the committed bundle is stale
        # The server serves optical_modem/suite/static, which is committed. A
        # frontend change that forgets to rebuild ships nothing, and nothing in
        # the Python tests would catch it.
        run: git diff --exit-code -- optical_modem/suite/static
